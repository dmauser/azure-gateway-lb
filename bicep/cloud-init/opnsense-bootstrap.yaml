#cloud-config
#
# OPNsense Bootstrap — FreeBSD 14.4 (thefreebsdfoundation/freebsd-14_4)
# Generated by Ram (NVA / Scripts Engineer) — 2026-05-09T13:42:28-05:00
#
# Placeholder contract (Clu substitutes these at Bicep deploy time via string replace):
#   __URI__          Base URL for script/XML fetch (trailing slash required)
#                    e.g. https://raw.githubusercontent.com/dmauser/azure-gateway-lb/main/scripts/
#   __ROLE__         "Primary" or "Secondary" (literal; case-exact)
#   __LOCAL_CIDR__   Local NVA IP with CIDR notation, e.g. 10.0.1.4/24
#   __PEER_IP__      Peer NVA IP without CIDR, e.g. 10.0.1.5
#
# FreeBSD cloud-init specifics:
#   - runcmd executes each item via /bin/sh -c as root
#   - fetch is in FreeBSD base at /usr/bin/fetch (not curl/wget)
#   - tee is in FreeBSD base at /usr/bin/tee
#   - cloud-init status --wait is available (cloud-init ships as a Python port)
#   - apt:/packages:/users: directives are Linux-only — intentionally omitted
#   - hostname: directive fires before runcmd; runcmd step 0 overrides to lowercase
#
# Post-deploy validation:
#   Quorra smoke test: ssh to NVA and check:
#     cat /var/run/opnsense-bootstrap-done     # sentinel written by last runcmd
#     cat /var/log/opnsense-bootstrap.log      # full script output
#     cloud-init status --wait                 # cloud-init overall status

# OS-level hostname (Bicep injects Primary-nva or Secondary-nva; runcmd step 0 lowercases it)
hostname: __ROLE__-nva

runcmd:
  # Step 0: Set hostname lowercase (primary-nva / secondary-nva)
  #         cloud-init hostname: module fires before runcmd — this overrides it cleanly.
  - "hostname $(echo __ROLE__ | tr '[:upper:]' '[:lower:]')-nva"

  # Step 1: Fetch the bootstrap script using FreeBSD base fetch
  - "/usr/bin/fetch -o /tmp/configureopnsense.sh '__URI__configureopnsense.sh'"
  - "chmod +x /tmp/configureopnsense.sh"

  # Step 2: Execute bootstrap (canonical 4-arg contract: URI, Role, LocalCIDR, PeerIP)
  #         Redirect stdout+stderr to log; do NOT pipe through tee — tee always exits 0,
  #         masking the script's real exit code and causing the sentinel to be written on failure.
  #         cat the log after so cloud-init's own log captures full output for debugging.
  #         Sentinel written only on true success; failure sentinel written with exit code.
  - "/tmp/configureopnsense.sh '__URI__' '__ROLE__' '__LOCAL_CIDR__' '__PEER_IP__' > /var/log/opnsense-bootstrap.log 2>&1; rc=$?; cat /var/log/opnsense-bootstrap.log; [ $rc -eq 0 ] && echo \"bootstrap-ok-$(date -u +%Y%m%dT%H%M%SZ)\" > /var/run/opnsense-bootstrap-done || echo \"bootstrap-failed-rc=$rc-$(date -u +%Y%m%dT%H%M%SZ)\" > /var/run/opnsense-bootstrap-failed; exit $rc"
